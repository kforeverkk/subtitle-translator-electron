name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Static Checks and Unit Tests
        run: pnpm run check

      - name: Install Electron E2E System Dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Run Electron E2E Tests
        id: electron_e2e
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: xvfb-run --auto-servernum pnpm run e2e

      - name: Upload Electron E2E Failure Report
        if: failure() && steps.electron_e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: electron-e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
