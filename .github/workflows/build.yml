name: Build

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-version:
    name: Verify Release Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0

      - name: Compare Source Version with Release Tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/verify-release-version.mjs

  build:
    name: Build (${{ matrix.os }})
    needs: verify-version
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Release Files
        run: pnpm run build

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release_on_${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release_on_*
          path: artifacts

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          set -euo pipefail
          checksum_file="artifacts/SHA256SUMS.txt"
          : > "$checksum_file"

          while IFS= read -r -d '' artifact; do
            checksum="$(sha256sum "$artifact" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$checksum" "$(basename "$artifact")" >> "$checksum_file"
          done < <(
            find artifacts -type f \
              \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' \) \
              -print0 | sort -z
          )

          test -s "$checksum_file"

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            artifacts/**/subtitle-translator_${{ github.ref_name }}.dmg
            artifacts/**/subtitle-translator_${{ github.ref_name }}.exe
            artifacts/**/subtitle-translator_${{ github.ref_name }}.AppImage
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ### Download
            - Homebrew: `brew install --cask kforeverkk/tap/subtitle-translator-electron`
            - [Windows](https://github.com/kforeverkk/subtitle-translator-electron/releases/download/${{ github.ref_name }}/subtitle-translator_${{ github.ref_name }}.exe)
            - [macOS](https://github.com/kforeverkk/subtitle-translator-electron/releases/download/${{ github.ref_name }}/subtitle-translator_${{ github.ref_name }}.dmg)
            - [Linux](https://github.com/kforeverkk/subtitle-translator-electron/releases/download/${{ github.ref_name }}/subtitle-translator_${{ github.ref_name }}.AppImage)
            - [SHA-256 checksums](https://github.com/kforeverkk/subtitle-translator-electron/releases/download/${{ github.ref_name }}/SHA256SUMS.txt)
      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh workflow run update-casks.yml \
            --repo kforeverkk/homebrew-tap \
            --ref main
